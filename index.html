<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 0-1: HTML基礎確認</title>
</head>
<body>
    <h1>🌐 Phase 0-1: HTML基礎確認</h1>
    <div>
        <h2>📝 課題1: 自己紹介セクション作成</h2>
        <p><strong>指示:</strong> 下記のHTMLコメント部分に、あなたの自己紹介を書いてください。</p>
        <!-- ここに自己紹介のHTMLを書いてください
        例:
        <h3>自己紹介</h3>
        <p>名前: 清水達己</p>
        <p>職業: 大学生</p>
        <p>趣味: ゲーム</p>
        -->
        <p>✅ 完了したら、この課題は終了です</p>
    </div>
    <div>
        <h2>📋 課題2: リスト作成</h2>
        <p><strong>指示:</strong> 好きな食べ物を5つ、番号付きリスト（ol）で作成してください。</p>
        <!-- ここに好きな食べ物のリストを作成してください -->
        <ol>
            <li><P>りんご</P></li>
            <li><P>ごま</P></li>
            <li><P>まだい</P></li>
            <li><P>いか</P></li>
            <li><P>カルパッチョ</P></li>
        </ol>
    </div>
    <div>
        <h2>🔗 課題3: リンク作成</h2>
        <p><strong>指示:</strong> 以下のリンクを作成してください：</p>
        <ul>
            <li><p><a href="https://www.google.com/">Google（新しいタブで開く）</a></p></li>
            <li><p><a href="https://github.com/"><GitHub（新しいタブで開く）</a></p></li>
        </ul>
      <!-- ここにリンクを作成してください -->
    </div>
</body>
</html>
